name: Verification

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Strict types and deterministic tests
        run: pnpm check
      - name: Runner lifecycle sequencing and failure-path tests
        run: python3 -B -m unittest discover -s packages/runner/host
      - name: Protected health probe contract tests
        run: node --test fixtures/runner/standard-web-baseline.test.mjs
      - name: Real PostgreSQL 17 domain, Worker recovery and external MCP
        run: pnpm test:integration
      - name: Export and restore across independent PostgreSQL 17 clusters
        run: pnpm probe:backup
      - name: Authenticated MCP protocol smoke
        run: pnpm probe:mcp
      - name: Evaluation preparation and trusted fixture
        run: pnpm probe:evaluation

  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ITERVANE_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record preinstalled Chrome version
        run: google-chrome --version
      - name: Verify pinned Chinese font for browser evidence
        run: |
          font_dir="$HOME/.local/share/fonts/itervane-ci"
          mkdir -p "$font_dir"
          curl --fail --location --retry 2 --output "$font_dir/NotoSansCJKsc-Regular.otf" https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          printf '%s  %s\n' '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b' "$font_dir/NotoSansCJKsc-Regular.otf" | sha256sum --check --status
          curl --fail --location --retry 2 --output "$font_dir/OFL.txt" https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/LICENSE
          fc-cache -f "$font_dir"
          fc-match -f '%{family}\n' ':lang=zh-cn'
      - name: Real browser, Keycloak, PostgreSQL and Worker
        run: pnpm test:portal
      - name: Sanitized browser verification evidence
        if: always()
        run: test ! -f .reports/p1-c/browser.json || cat .reports/p1-c/browser.json
      - name: Application-only failure screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portal-application-failures
          path: .reports/p1-c/failed-*.png
          if-no-files-found: ignore
          retention-days: 3

  scanners:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Real scanners on maintainer-generated fixtures only
        run: pnpm probe:scanners

# Live models, cloud/VM isolation, and native operations require separate
# maintainer-controlled evidence. A green CI run is not P0 completion.
