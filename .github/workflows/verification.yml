name: Verification

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Strict types and deterministic tests
        run: pnpm check
      - name: Real PostgreSQL 17 domain, Worker recovery and external MCP
        run: pnpm test:integration
      - name: Authenticated MCP protocol smoke
        run: pnpm probe:mcp
      - name: Evaluation preparation and trusted fixture
        run: pnpm probe:evaluation

  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium and OS libraries
        run: pnpm --filter @itervane/portal exec playwright install --with-deps chromium
      - name: Real browser, Keycloak, PostgreSQL and Worker
        run: pnpm test:portal
      - name: Sanitized browser verification evidence
        if: always()
        run: test ! -f .reports/p1-c/browser.json || cat .reports/p1-c/browser.json

# Live models, cloud/VM isolation, and native operations require separate
# maintainer-controlled evidence. A green CI run is not P0 completion.
