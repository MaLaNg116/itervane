name: Native Runner

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - '.github/workflows/native-runner.yml'
      - 'packages/runner/host/**'
      - 'packages/runner/src/**'
      - 'packages/control-plane/src/**'
      - 'packages/control-plane/migrations/**'
      - 'packages/control-plane/test/helpers/**'
      - 'packages/control-plane/test/native/**'
      - 'packages/contracts/src/**'
      - 'packages/agent/**'
      - 'packages/model/**'
      - 'packages/rules/**'
      - 'packages/verification/src/postgres-fixture.ts'
      - 'packages/verification/src/runner-vm.ts'
      - 'packages/verification/src/report.ts'
      - 'fixtures/runner/**'
      - 'fixtures/komodo/**'
      - 'fixtures/ingress/**'
      - 'packages/verification/src/native/komodo*.ts'
      - 'packages/verification/src/native/rollout-realm.ts'
      - 'fixtures/standard-app/**'
      - 'scripts/prepare-runner-inspection.ts'
      - 'scripts/prepare-runner-build-dependencies.ts'
      - 'scripts/prepare-runner-oci-inputs.sh'
      - 'scripts/probe-qualified-runner.ts'
      - 'scripts/scanner-tools.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kvm-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        scenario: [regression, standard-build, standard-build-missing-cache, standard-oci, protected-release]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Observe KVM API and an empty VM descriptor
        id: capability
        run: |
          mkdir -p .reports/p0
          sudo -n /usr/bin/python3 -I -B packages/runner/host/kvm_preflight.py | tee .reports/p0/kvm-host.json
          /usr/bin/python3 -c 'import json; d=json.load(open(".reports/p0/kvm-host.json")); print("available=" + ("true" if d["result"] == "vm_descriptor_created" else "false"))' >> "$GITHUB_OUTPUT"
      - name: Install native lifecycle tools on the disposable host
        if: steps.capability.outputs.available == 'true'
        timeout-minutes: 8
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          extras=()
          if [[ "${{ matrix.scenario }}" == standard-oci || "${{ matrix.scenario }}" == protected-release ]]; then extras+=(skopeo); fi
          sudo -n apt-get "${apt_options[@]}" update -qq
          sudo -n apt-get "${apt_options[@]}" install -y --no-install-recommends gdisk guestfish guestfs-tools libvirt-daemon-system libvirt-clients python3-libvirt qemu-system-x86 qemu-utils "${extras[@]}"
          dpkg-query -W gdisk guestfish guestfs-tools libvirt-daemon-system python3-libvirt qemu-system-x86 > .reports/p0/kvm-packages.txt
          cat .reports/p0/kvm-packages.txt
      - name: Prepare the dedicated KVM session
        id: session
        if: steps.capability.outputs.available == 'true'
        env:
          PROBE_HOST_ENVIRONMENT: ${{ runner.environment }}
        run: |
          directory=$(sudo -n mktemp -d /var/lib/libvirt/images/itervane-native.XXXXXXXX)
          sudo -n chmod 0711 "$directory"
          bash fixtures/runner/prepare-native-session.sh "$directory"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.capability.outputs.available == 'true'
        with:
          node-version: 24.14.0
      - name: Install the pinned workspace package manager
        if: steps.capability.outputs.available == 'true'
        run: |
          npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Prepare verified offline scanner inputs
        id: inspection
        if: steps.capability.outputs.available == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          scratch=$(mktemp -d "$RUNNER_TEMP/itervane-scan.XXXXXXXX")
          payload="$scratch/itervane-inspection"
          pnpm exec tsx scripts/prepare-runner-inspection.ts "$payload" | tee "$scratch/preparation.log"
          test -s "$payload/inputs.json"
          tail -n 1 "$scratch/preparation.log" > .reports/p0/kvm-inspection-inputs.json
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
      - name: Prepare the pinned OCI basis for the image trial
        id: oci
        if: steps.capability.outputs.available == 'true' && (matrix.scenario == 'standard-oci' || matrix.scenario == 'protected-release')
        run: |
          payload="$RUNNER_TEMP/itervane-oci-inputs"
          bash scripts/prepare-runner-oci-inputs.sh "$payload" > .reports/p0/kvm-oci-inputs.json
          test -s "$payload/inputs.json"
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
      - name: Prepare sealed build inputs for the selected trial
        id: build
        if: steps.capability.outputs.available == 'true' && matrix.scenario != 'regression'
        env:
          BUILD_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/itervane-build.XXXXXXXX")
          payload="$scratch/itervane-build-inputs"
          args=("$payload")
          if [[ "$BUILD_SCENARIO" == standard-oci || "$BUILD_SCENARIO" == protected-release ]]; then
            oci=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ociInputsSha256"])' .reports/p0/kvm-oci-inputs.json)
            args+=("$oci")
          fi
          pnpm exec tsx scripts/prepare-runner-build-dependencies.ts "${args[@]}" | tee "$scratch/preparation.log"
          test -s "$payload/profile.json"
          tail -n 1 "$scratch/preparation.log" > .reports/p0/kvm-build-inputs.json
          if [[ "$BUILD_SCENARIO" == standard-build-missing-cache ]]; then
            /usr/bin/python3 - "$payload" <<'PY'
          import base64
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          dependencies = json.loads((root / "dependencies.json").read_bytes())
          [express] = [entry for entry in dependencies["tarballs"]
                       if entry["url"] == "https://registry.npmjs.org/express/-/express-5.3.0.tgz"]
          digest = base64.b64decode(express["integrity"].removeprefix("sha512-"), validate=True).hex()
          assert len(digest) == 128
          cache = root / "npm-cache" / "_cacache" / "content-v2" / "sha512"
          blob = cache / digest[:2] / digest[2:4] / digest[4:]
          assert hashlib.sha512(blob.read_bytes()).hexdigest() == digest
          blob.unlink()
          PY
          fi
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
      - name: Prepare and seal the trusted offline guest
        if: steps.capability.outputs.available == 'true'
        env:
          PROBE_DIRECTORY: ${{ steps.session.outputs.directory }}
          INSPECTION_PAYLOAD: ${{ steps.inspection.outputs.payload }}
          BUILD_PAYLOAD: ${{ steps.build.outputs.payload }}
          OCI_PAYLOAD: ${{ steps.oci.outputs.payload }}
        run: |
          args=("$PROBE_DIRECTORY" "$INSPECTION_PAYLOAD")
          if [[ -n "$BUILD_PAYLOAD" ]]; then args+=("$BUILD_PAYLOAD"); fi
          if [[ -n "$OCI_PAYLOAD" ]]; then args+=("$OCI_PAYLOAD"); fi
          sudo -n bash fixtures/runner/prepare-probe-image.sh "${args[@]}"
          sudo -n cat "$PROBE_DIRECTORY/image.json" > .reports/p0/kvm-image.json
          case "$INSPECTION_PAYLOAD" in
            "$RUNNER_TEMP"/itervane-scan.????????/itervane-inspection)
              rm -- "$INSPECTION_PAYLOAD/cache/db/trivy.db"
              ;;
            *) exit 1 ;;
          esac
      - name: Verify source snapshots, offline scanners and guest lifecycle on KVM
        if: steps.capability.outputs.available == 'true'
        env:
          PROBE_DIRECTORY: ${{ steps.session.outputs.directory }}
          PROBE_HOST_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_SCENARIO: ${{ matrix.scenario }}
        run: |
          test -s .reports/p0/kvm-inspection-inputs.json
          if [[ "$NATIVE_SCENARIO" == protected-release ]]; then
            export ITERVANE_NATIVE_RELEASE_PROXIES="$RUNNER_TEMP/itervane-release-proxies"
            bash fixtures/ingress/prepare-proxies.sh "$ITERVANE_NATIVE_RELEASE_PROXIES"
          fi
          bash fixtures/runner/run-native-session.sh "$PROBE_DIRECTORY" "$NATIVE_SCENARIO"
      - name: Require the verified protected release on the dedicated scenario
        if: matrix.scenario == 'protected-release'
        env:
          KVM_AVAILABLE: ${{ steps.capability.outputs.available }}
        run: |
          test "$KVM_AVAILABLE" = true
          jq -e '.release.healthStatus == 200 and .release.httpMcpAgreement == true' .reports/p0/runner-protected-release.json >/dev/null
      - name: Retain independent KVM evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.scenario == 'regression' && 'kvm-host-evidence' || format('kvm-{0}-evidence', matrix.scenario) }}
          path: |
            .reports/p0/kvm-host.json
            .reports/p0/kvm-session-host.json
            .reports/p0/kvm-image.json
            .reports/p0/kvm-inspection-inputs.json
            .reports/p0/kvm-build-inputs.json
            .reports/p0/kvm-oci-inputs.json
            .reports/p0/kvm-packages.txt
            .reports/p0/runner-vm*.json
            .reports/p0/runner-qualified-*.json
            .reports/p0/runner-worker-inspection.json
            .reports/p0/runner-worker-build.json
            .reports/p0/runner-protected-release.json
            .reports/p0/runner-oci-artifact.json
            .reports/p0/runner-retry-oci-artifact.json
          if-no-files-found: error
          retention-days: 14
