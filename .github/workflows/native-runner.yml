name: Native Runner

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - '.github/workflows/native-runner.yml'
      - 'packages/runner/host/**'
      - 'packages/runner/src/**'
      - 'packages/control-plane/src/**'
      - 'packages/control-plane/migrations/**'
      - 'packages/control-plane/test/helpers/**'
      - 'packages/control-plane/test/native/**'
      - 'packages/contracts/src/**'
      - 'packages/agent/**'
      - 'packages/model/**'
      - 'packages/rules/**'
      - 'packages/verification/src/postgres-fixture.ts'
      - 'packages/verification/src/runner-vm.ts'
      - 'packages/verification/src/report.ts'
      - 'fixtures/runner/**'
      - 'fixtures/komodo/**'
      - 'fixtures/ingress/**'
      - 'fixtures/whiskers/**'
      - 'packages/portal/test/native/whiskers*.ts'
      - 'packages/verification/src/native/komodo*.ts'
      - 'packages/verification/src/native/whiskers.ts'
      - 'packages/verification/src/native/rollout-realm.ts'
      - 'packages/verification/src/native/npm-release-fixture.ts'
      - 'fixtures/standard-app/**'
      - 'scripts/prepare-runner-inspection.ts'
      - 'scripts/prepare-runner-build-dependencies.ts'
      - 'scripts/prepare-runner-oci-inputs.sh'
      - 'scripts/probe-qualified-runner.ts'
      - 'scripts/scanner-tools.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kvm-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        scenario: [regression, standard-build, standard-build-missing-cache, standard-oci, protected-release, protected-release-npm, protected-release-drift, protected-release-faults, protected-release-operations, protected-release-restore, protected-release-restore-authorization, protected-release-linked-health]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Observe KVM API and an empty VM descriptor
        id: capability
        run: |
          mkdir -p .reports/p0
          sudo -n /usr/bin/python3 -I -B packages/runner/host/kvm_preflight.py | tee .reports/p0/kvm-host.json
          /usr/bin/python3 -c 'import json; d=json.load(open(".reports/p0/kvm-host.json")); print("available=" + ("true" if d["result"] == "vm_descriptor_created" else "false"))' >> "$GITHUB_OUTPUT"
      - name: Install native lifecycle tools on the disposable host
        if: steps.capability.outputs.available == 'true'
        timeout-minutes: 8
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          extras=()
          if [[ "${{ matrix.scenario }}" == standard-oci || "${{ matrix.scenario }}" == protected-release* ]]; then extras+=(skopeo); fi
          sudo -n apt-get "${apt_options[@]}" update -qq
          sudo -n apt-get "${apt_options[@]}" install -y --no-install-recommends gdisk guestfish guestfs-tools libvirt-daemon-system libvirt-clients python3-libvirt qemu-system-x86 qemu-utils "${extras[@]}"
          dpkg-query -W gdisk guestfish guestfs-tools libvirt-daemon-system python3-libvirt qemu-system-x86 > .reports/p0/kvm-packages.txt
          cat .reports/p0/kvm-packages.txt
      - name: Prepare the dedicated KVM session
        id: session
        if: steps.capability.outputs.available == 'true'
        env:
          PROBE_HOST_ENVIRONMENT: ${{ runner.environment }}
        run: |
          directory=$(sudo -n mktemp -d /var/lib/libvirt/images/itervane-native.XXXXXXXX)
          sudo -n chmod 0711 "$directory"
          bash fixtures/runner/prepare-native-session.sh "$directory"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.capability.outputs.available == 'true'
        with:
          node-version: 24.14.0
      - name: Install the pinned workspace package manager
        if: steps.capability.outputs.available == 'true'
        run: |
          npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Prepare verified offline scanner inputs
        id: inspection
        if: steps.capability.outputs.available == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          scratch=$(mktemp -d "$RUNNER_TEMP/itervane-scan.XXXXXXXX")
          payload="$scratch/itervane-inspection"
          pnpm exec tsx scripts/prepare-runner-inspection.ts "$payload" | tee "$scratch/preparation.log"
          test -s "$payload/inputs.json"
          tail -n 1 "$scratch/preparation.log" > .reports/p0/kvm-inspection-inputs.json
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
      - name: Prepare the pinned OCI basis for the image trial
        id: oci
        if: steps.capability.outputs.available == 'true' && (matrix.scenario == 'standard-oci' || startsWith(matrix.scenario, 'protected-release'))
        run: |
          payload="$RUNNER_TEMP/itervane-oci-inputs"
          bash scripts/prepare-runner-oci-inputs.sh "$payload" > .reports/p0/kvm-oci-inputs.json
          test -s "$payload/inputs.json"
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
      - name: Prepare sealed build inputs for the selected trial
        id: build
        if: steps.capability.outputs.available == 'true' && matrix.scenario != 'regression'
        env:
          BUILD_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/itervane-build.XXXXXXXX")
          payload="$scratch/itervane-build-inputs"
          args=("$payload")
          if [[ "$BUILD_SCENARIO" == standard-oci || "$BUILD_SCENARIO" == protected-release* ]]; then
            oci=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["ociInputsSha256"])' .reports/p0/kvm-oci-inputs.json)
            args+=("$oci")
          fi
          if [[ "$BUILD_SCENARIO" == protected-release-npm ]]; then args+=(approved-npm); fi
          pnpm exec tsx scripts/prepare-runner-build-dependencies.ts "${args[@]}" | tee "$scratch/preparation.log"
          test -s "$payload/profile.json"
          tail -n 1 "$scratch/preparation.log" > .reports/p0/kvm-build-inputs.json
          if [[ "$BUILD_SCENARIO" == standard-build-missing-cache ]]; then
            /usr/bin/python3 - "$payload" <<'PY'
          import base64
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          dependencies = json.loads((root / "dependencies.json").read_bytes())
          [express] = [entry for entry in dependencies["tarballs"]
                       if entry["url"] == "https://registry.npmjs.org/express/-/express-5.3.0.tgz"]
          digest = base64.b64decode(express["integrity"].removeprefix("sha512-"), validate=True).hex()
          assert len(digest) == 128
          cache = root / "npm-cache" / "_cacache" / "content-v2" / "sha512"
          blob = cache / digest[:2] / digest[2:4] / digest[4:]
          assert hashlib.sha512(blob.read_bytes()).hexdigest() == digest
          blob.unlink()
          PY
          fi
          printf 'payload=%s\n' "$payload" >> "$GITHUB_OUTPUT"
      - name: Prepare and seal the trusted offline guest
        if: steps.capability.outputs.available == 'true'
        env:
          PROBE_DIRECTORY: ${{ steps.session.outputs.directory }}
          INSPECTION_PAYLOAD: ${{ steps.inspection.outputs.payload }}
          BUILD_PAYLOAD: ${{ steps.build.outputs.payload }}
          OCI_PAYLOAD: ${{ steps.oci.outputs.payload }}
        run: |
          args=("$PROBE_DIRECTORY" "$INSPECTION_PAYLOAD")
          if [[ -n "$BUILD_PAYLOAD" ]]; then args+=("$BUILD_PAYLOAD"); fi
          if [[ -n "$OCI_PAYLOAD" ]]; then args+=("$OCI_PAYLOAD"); fi
          sudo -n bash fixtures/runner/prepare-probe-image.sh "${args[@]}"
          sudo -n cat "$PROBE_DIRECTORY/image.json" > .reports/p0/kvm-image.json
          case "$INSPECTION_PAYLOAD" in
            "$RUNNER_TEMP"/itervane-scan.????????/itervane-inspection)
              rm -- "$INSPECTION_PAYLOAD/cache/db/trivy.db"
              ;;
            *) exit 1 ;;
          esac
      - name: Verify source snapshots, offline scanners and guest lifecycle on KVM
        if: steps.capability.outputs.available == 'true'
        env:
          PROBE_DIRECTORY: ${{ steps.session.outputs.directory }}
          PROBE_HOST_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_SCENARIO: ${{ matrix.scenario }}
        run: |
          test -s .reports/p0/kvm-inspection-inputs.json
          if [[ "$NATIVE_SCENARIO" == protected-release* ]]; then
            export ITERVANE_NATIVE_RELEASE_PROXIES="$RUNNER_TEMP/itervane-release-proxies"
            bash fixtures/ingress/prepare-proxies.sh "$ITERVANE_NATIVE_RELEASE_PROXIES"
          fi
          bash fixtures/runner/run-native-session.sh "$PROBE_DIRECTORY" "$NATIVE_SCENARIO"
      - name: Require native reproduction, bounded repair and independent health receipts
        if: matrix.scenario == 'standard-build'
        env:
          KVM_AVAILABLE: ${{ steps.capability.outputs.available }}
        run: |
          test "$KVM_AVAILABLE" = true
          jq -e '.healthFollowup as $proof |
            $proof.healthy.build.baseline.healthFollowup.status == "passed" and
            $proof.reproduced.build.baseline.healthFollowup == {"status":"unhealthy", "code":"application_unhealthy", "statusCode":503} and
            $proof.repaired.build.baseline.healthFollowup == {"status":"passed", "code":null, "statusCode":200} and
            $proof.repaired.repair.previousReceiptSha256 == $proof.reproduced.receiptSha256 and
            $proof.repaired.repair.path == "server/app.mjs" and $proof.repaired.repair.cleanupConfirmed and
            $proof.repaired.repair.patchSha256 == $proof.repaired.patchSha256 and
            $proof.repaired.repair.beforeSha256 != $proof.repaired.repair.afterSha256 and
            ([$proof.healthy.build.runId, $proof.reproduced.build.runId, $proof.repaired.build.runId,
              $proof.repaired.repair.observationDomainId, $proof.repaired.repair.repairDomainId] | unique | length == 5) and
            ([$proof.healthy, $proof.reproduced, $proof.repaired] | all(.cleanupConfirmed and .build.baseline.appExited and
              .build.baseline.status == "passed" and (.build.baseline.checks | length) == 5 and .build.baseline.checks[0].statusCode == 200))' \
            .reports/p0/runner-worker-build.json >/dev/null
      - name: Require the verified protected release on the dedicated scenario
        if: startsWith(matrix.scenario, 'protected-release')
        env:
          KVM_AVAILABLE: ${{ steps.capability.outputs.available }}
          NATIVE_SCENARIO: ${{ matrix.scenario }}
        run: |
          test "$KVM_AVAILABLE" = true
          report=.reports/p0/runner-protected-release.json
          if [[ "$NATIVE_SCENARIO" == protected-release-drift ]]; then
            jq -e '.drift.target.reason == "release_target_changed" and .drift.archive.reason == "release_archive_unavailable" and
              .drift.target.externalSteps == 0 and .drift.archive.externalSteps == 0 and .drift.archive.archiveReadPrepared == true and
              .drift.originalArchiveRestored == true' "$report" >/dev/null
            exit 0
          fi
          if [[ "$NATIVE_SCENARIO" == protected-release-faults ]]; then
            jq -e '.faults.health.reason == "release_rollout_health_failed" and .faults.health.originStatusAfter == 503 and
              .faults.identity.reason == "release_rollout_unavailable" and .faults.identity.originStatusAfter == 200 and
              ([.faults.health, .faults.identity] | all(.environmentHeld and .httpMcpAgreement and .recovery.writes == 1 and
                (.anonymousStatus == 401 or .anonymousStatus == 403)))' "$report" >/dev/null
            exit 0
          fi
          jq -e '.release.healthStatus == 200 and .release.httpMcpAgreement == true' "$report" >/dev/null
          if [[ "$NATIVE_SCENARIO" == protected-release-linked-health ]]; then
            jq -e '.release as $original | .linkedHealth as $proof |
              $proof.originalReleaseOperationId == $original.operationId and $proof.diagnosis.releaseOperationId == $original.operationId and
              $proof.diagnosis.recommendation == "investigate_code" and $proof.diagnosis.logErrorLines > 0 and $proof.diagnosis.httpMcpAgreement and
              $proof.confirmationReplay and $proof.deniedApiOwner and $proof.deniedStaleFingerprint and
              ($proof.incidentInterfaces | .httpMcpAgreement and .bilingual and .stopReplay and .stopDeniedWithoutPortal and .stopBoundToRelease and
                .stopReason == "operator_stopped" and .stoppedSampleSequence > $proof.sampleSequence and .linkedTaskId == $proof.release.taskId) and
              $proof.originalRunId != $proof.repairedRunId and $proof.before.domainId != $proof.after.domainId and
              $proof.before.health.status == "unhealthy" and $proof.before.health.statusCode == 503 and
              $proof.after.health.status == "passed" and $proof.after.health.statusCode == 200 and
              $proof.before.cleanupConfirmed and $proof.after.cleanupConfirmed and $proof.after.changedPath == "server/app.mjs" and
              ($proof.after.patchSha256 | test("^[a-f0-9]{64}$")) and
              $proof.learningCase.origin.taskId == $proof.release.taskId and $proof.learningCase.origin.runId == $proof.repairedRunId and
              $proof.learningCase.origin.facts.category == "reproduced_health_failure" and
              $proof.learningCase.origin.facts.patchSha256 == $proof.after.patchSha256 and
              $proof.learningCase.origin.facts.reproductionSha256 == $proof.before.receiptSha256 and
              $proof.ruleExtraction.caseId == $proof.learningCase.id and $proof.ruleExtraction.caseSha256 == $proof.learningCase.sha256 and
              $proof.ruleExtraction.candidateKind == "code_rule" and $proof.ruleExtraction.usage.toolCalls == 2 and
              ($proof.ruleExtraction.candidateSemanticSha256 | test("^[a-f0-9]{64}$")) and
              $proof.originalContainerId != $proof.recoveredContainerId and $proof.release.operationId != $original.operationId and
              $proof.release.version != $original.version and $proof.release.manifestDigest != $original.manifestDigest and
              $proof.release.approvalDeniedWithoutPortal and $proof.release.healthStatus == 200 and $proof.release.httpMcpAgreement and
              ($proof.healthySamples | length) == 2 and $proof.closedReason == "target_changed" and $proof.readOnlyKomodo and $proof.whiskersCleanup' "$report" >/dev/null
            test -s .reports/p0/runner-linked-health-oci-artifact.json
          fi
          if [[ "$NATIVE_SCENARIO" == protected-release-npm ]]; then
            jq -e '.release.repairCategory == "npm_dependency" and .dependency.advisoryId != null' "$report" >/dev/null
          fi
          if [[ "$NATIVE_SCENARIO" == protected-release-restore* ]]; then
            jq -e '.dualVersion as $versions | $versions.first.release as $first | $versions.second.release as $second |
              $versions.sameTarget and $versions.sameProtectedIngress and
              $versions.currentOperationId == $second.operationId and $versions.previousOperationId == $first.operationId and
              $first.operationId != $second.operationId and $first.updateId != $second.updateId and
              $first.version != $second.version and $first.manifestDigest != $second.manifestDigest and
              $first.configDigest != $second.configDigest and
              ([$first, $second] | all(.healthStatus == 200 and (.anonymousStatus == 401 or .anonymousStatus == 403) and
                .httpMcpAgreement and .approvalDeniedWithoutPortal))' "$report" >/dev/null
          fi
          if [[ "$NATIVE_SCENARIO" == protected-release-restore-authorization ]]; then
            jq -e '.dualVersion.first.release as $first | .dualVersion.second.release as $second | .restoreAuthorization as $cases |
              $cases.distinctKomodoReader and $cases.whiskersCleanup and ($cases.anonymousStatus == 401 or $cases.anonymousStatus == 403) and
              $cases.revoked.state == "cancelled" and $cases.revoked.blockedReason == "approval_revoked" and
              ($cases.revoked.environmentHeld == false) and $cases.expired.state == "needs_human" and
              $cases.expired.blockedReason == "proposal_expired" and ($cases.expired.environmentHeld == false) and
              $cases.targetChanged.state == "needs_human" and $cases.targetChanged.manualReason == "missing_update" and $cases.targetChanged.environmentHeld and
              ([$cases.revoked, $cases.expired, $cases.targetChanged] |
                (map(.executionId) | unique | length) == 3 and (map(.diagnosisRunId) | unique | length) == 3 and
                all(.currentOperationId == $second.operationId and .requestedOperationId == $first.operationId and
                  .writes == 0 and .originalContainerRetained and .slotReleased and .httpMcpAgreement))' "$report" >/dev/null
            jq -e '.dualVersion as $versions | .restoreAuthorization.health as $health | $health.diagnosis as $diagnosis |
              $health.releaseOperationId == $versions.currentOperationId and $health.containerId == $versions.currentContainerId and
              $health.signals == ["healthy", "runtime_stopped", "runtime_stopped", "healthy", "application_unhealthy", "probe_identity", "healthy"] and
              $health.samples == 7 and $health.incidents == 2 and $health.unknownPreserved and $health.eachRecovered and
              $diagnosis.attempt == 1 and $diagnosis.admissions == 1 and $diagnosis.sampleSequence > 0 and
              ($diagnosis.runId | test("^[a-f0-9-]{36}$")) and ($diagnosis.taskId | test("^[a-f0-9-]{36}$")) and
              ($diagnosis.incidentId | test("^[a-f0-9-]{36}$")) and ($diagnosis.sha256 | test("^[a-f0-9]{64}$")) and
              $diagnosis.releaseOperationId == $versions.currentOperationId and
              $diagnosis.previousReleaseOperationId == $versions.first.release.operationId and $diagnosis.recommendation == "review_rollback" and
              $diagnosis.sections == ["container", "release"] and $diagnosis.model == "scripted_anthropic_fixture" and
              $diagnosis.sameTaskAfterReinstall and $diagnosis.skippedAfterRevocation and $diagnosis.httpMcpAgreement and
              $diagnosis.matchedPublishedTarget' "$report" >/dev/null
          fi
          if [[ "$NATIVE_SCENARIO" == protected-release-restore ]]; then
            jq -e '.dualVersion.first.release as $first | .dualVersion.second.release as $second | .restoration as $restored |
              $restored.stoppedState == "exited" and $restored.currentOperationId == $second.operationId and
              $restored.restoredOperationId == $first.operationId and $restored.restoredVersion == $first.version and
              $restored.restoredManifestDigest == $first.manifestDigest and $restored.restoredConfigDigest == $first.configDigest and
              $restored.updateId != $first.updateId and $restored.updateId != $second.updateId and
              $restored.stoppedContainerId != $restored.restoredContainerId and $restored.readFence > $restored.sendFence and
              ($restored.proofSha256 | test("^[a-f0-9]{64}$")) and
              $restored.healthStatus == 200 and ($restored.anonymousStatus == 401 or $restored.anonymousStatus == 403) and
              $restored.blockedBeforeApproval and $restored.portalIdentityRequired and $restored.idempotent and
              $restored.configureReceipts == 1 and $restored.deployReceipts == 1 and
              $restored.environmentReleased and $restored.slotReleased and $restored.distinctKomodoReader and
              $restored.httpMcpAgreement and $restored.whiskersCleanup and
              $restored.stoppedDiagnosis.recommendation == "review_rollback" and
              $restored.stoppedDiagnosis.releaseOperationId == $second.operationId and
              $restored.stoppedDiagnosis.previousReleaseOperationId == $first.operationId and
              $restored.postRestoreDiagnosis.recommendation == "continue_observation" and
              $restored.postRestoreDiagnosis.releaseOperationId == $first.operationId and
              $restored.postRestoreDiagnosis.restoreExecutionId == $restored.executionId and
              ([$restored.stoppedDiagnosis, $restored.postRestoreDiagnosis] |
                all(.httpMcpAgreement and .matchedPublishedTarget and .model == "scripted_anthropic_fixture"))' "$report" >/dev/null
            jq -e '.restoration as $restored | $restored.recordedTakeover as $settled | .dualVersion.second.release as $second |
              $settled.executionId != $restored.executionId and
              $settled.diagnosisRestoreExecutionId == $restored.executionId and
              $settled.currentOperationId == $restored.restoredOperationId and $settled.restoredOperationId == $second.operationId and
              $settled.restoredConfigDigest == $second.configDigest and $settled.restoredManifestDigest == $second.manifestDigest and
              $settled.updateId == $settled.takeover.durableUpdateId and $settled.updateId != $restored.updateId and
              $settled.takeover.approvalRevoked and $settled.takeover.changedWorker and $settled.takeover.matchingRuntimeBeforeAndAfter and
              $settled.readFence > $settled.sendFence and $settled.sendFence > $restored.readFence and
              $settled.configureReceipts == 1 and $settled.deployReceipts == 1 and
              $settled.healthStatus == 200 and ($settled.anonymousStatus == 401 or $settled.anonymousStatus == 403) and
              $settled.environmentReleased and $settled.slotReleased and $settled.httpMcpAgreement' "$report" >/dev/null
            jq -e '.restoration as $restored | $restored.recordedTakeover as $settled | $restored.interruption as $interrupted |
              $interrupted.executionId != $settled.executionId and
              $interrupted.diagnosisRestoreExecutionId == $settled.executionId and
              $interrupted.currentOperationId == $settled.restoredOperationId and
              $interrupted.attemptedOperationId == $settled.currentOperationId and
              $interrupted.observedConfigDigest == .dualVersion.first.release.configDigest and
              $interrupted.observedContainerId != $settled.restoredContainerId and
              $interrupted.reason == "missing_update" and
              $interrupted.acknowledgementMissing and $interrupted.changedWorker and
              $interrupted.sendSteps == 2 and $interrupted.readFence > $interrupted.sendFence and
              $interrupted.sendFence > $settled.readFence and
              $interrupted.matchingRuntimeBeforeAndAfter and $interrupted.environmentHeld and
              $interrupted.publicationBlocked and $interrupted.slotReleased and $interrupted.httpMcpAgreement' "$report" >/dev/null
          fi
          if [[ "$NATIVE_SCENARIO" == protected-release-operations ]]; then
            jq -e '.operations.releaseOperationId == .release.operationId and .operations.state == "running" and
              .operations.receipts == 1 and .operations.reads == 1 and .operations.releaseDispatches == 1 and
              .operations.matchedPublishedTarget and .operations.httpMcpAgreement and .operations.slotReleased and
              .operations.whiskersCleanup and
              .operations.diagnosis.releaseOperationId == .release.operationId and
              .operations.diagnosis.sections == ["container", "release", "logs", "metrics"] and
              .operations.diagnosis.matchedPublishedTarget and .operations.diagnosis.httpMcpAgreement and
              .operations.diagnosis.model == "scripted_anthropic_fixture" and .operations.restartReadback.sameContainer and
              .operations.restartReadback.recoveredStart > .operations.restartReadback.stoppedStart and
              (.operations.restartReadback.protectedStatus == 401 or .operations.restartReadback.protectedStatus == 403) and
              .operations.restartReadback.healthStatus == 200 and
              .operations.restart.releaseOperationId == .release.operationId and
              .operations.restart.activeContainer == .operations.containerId and
              .operations.restart.diagnosisRunId != .operations.diagnosis.runId and
              .operations.restart.diagnosisSections == ["container", "release"] and
              .operations.restart.model == "scripted_anthropic_fixture" and
              (.operations.restart.approvalId | test("^[a-f0-9]{32}$")) and
              (.operations.restart.proofSha256 | test("^[a-f0-9]{64}$")) and
              .operations.restart.recoveredStart > .operations.restart.stoppedStart and
              (.operations.restart.anonymousStatus == 401 or .operations.restart.anonymousStatus == 403) and
              .operations.restart.healthStatus == 200 and .operations.restart.nativeAuditCount == 1 and
              .operations.restart.resumeCount == 1 and .operations.restart.acknowledgedCount == 1 and
              .operations.restart.blockedBeforeApproval and .operations.restart.distinctKomodoReader and
              .operations.restart.restoreWorker.separateReadIdentity and .operations.restart.restoreWorker.mismatchedMappingDenied and
              .operations.restart.restoreWorker.idleWithoutWork and
              .operations.restart.learningCase.origin.runId == .operations.restart.diagnosisRunId and
              .operations.restart.learningCase.origin.evidenceSha256 == .operations.restart.proofSha256 and
              .operations.restart.learningCase.origin.facts.category == "recovered_stopped_instance" and
              .operations.restart.learningCase.origin.facts.sameInstance and .operations.restart.learningCase.origin.facts.healthStatus == 200 and
              .operations.restart.ruleExtraction.caseId == .operations.restart.learningCase.id and
              .operations.restart.ruleExtraction.caseSha256 == .operations.restart.learningCase.sha256 and
              .operations.restart.ruleExtraction.candidateKind == "runbook" and .operations.restart.ruleExtraction.usage.toolCalls == 2 and
              (.operations.restart.ruleExtraction.candidateSemanticSha256 | test("^[a-f0-9]{64}$")) and
              .operations.restart.environmentReleased and .operations.restart.slotReleased and .operations.restart.httpMcpAgreement' "$report" >/dev/null
            jq -e '.operations.restart as $verified | $verified.interrupted as $interrupted |
              $interrupted.releaseOperationId == .release.operationId and
              $interrupted.activeContainer == .operations.containerId and $interrupted.approvalId != $verified.approvalId and
              $interrupted.diagnosisRunId != $verified.diagnosisRunId and $interrupted.diagnosisSections == ["container", "release"] and
              $interrupted.stoppedStart == $verified.recoveredStart and $interrupted.recoveredStart > $interrupted.stoppedStart and
              ($interrupted.proofSha256 | test("^[a-f0-9]{64}$")) and
              ($interrupted.anonymousStatus == 401 or $interrupted.anonymousStatus == 403) and $interrupted.healthStatus == 200 and
              $interrupted.nativeAuditCount == 2 and $interrupted.resumeCount == 1 and $interrupted.acknowledgedCount == 0 and
              $interrupted.approvalRevoked and $interrupted.environmentHeld and $interrupted.publicationBlocked and
              $interrupted.slotReleased and ($interrupted.environmentReleased == false) and
              $interrupted.manualReason == "native_unconfirmed" and ($interrupted.sameWorker == false) and
              $interrupted.readFence > $interrupted.sendFence and $interrupted.httpMcpAgreement' "$report" >/dev/null
          fi
      - name: Retain independent KVM evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.scenario == 'regression' && 'kvm-host-evidence' || format('kvm-{0}-evidence', matrix.scenario) }}
          path: |
            .reports/p0/kvm-host.json
            .reports/p0/kvm-session-host.json
            .reports/p0/kvm-image.json
            .reports/p0/kvm-inspection-inputs.json
            .reports/p0/kvm-build-inputs.json
            .reports/p0/kvm-oci-inputs.json
            .reports/p0/kvm-packages.txt
            .reports/p0/runner-vm*.json
            .reports/p0/runner-qualified-*.json
            .reports/p0/runner-worker-inspection.json
            .reports/p0/runner-worker-build.json
            .reports/p0/runner-protected-release.json
            .reports/p0/runner-restore-oci-artifact.json
            .reports/p0/runner-drift-oci-artifact.json
            .reports/p0/runner-faults-oci-artifact.json
            .reports/p0/runner-linked-health-oci-artifact.json
            .reports/p0/runner-oci-artifact.json
            .reports/p0/runner-retry-oci-artifact.json
          if-no-files-found: error
          retention-days: 14
