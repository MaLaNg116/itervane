name: Release Acceptance

on:
  workflow_dispatch:
    inputs:
      verification_run:
        description: Successful Verification run ID for this commit
        required: true
        type: string
      native_run:
        description: Successful Native Runner run ID for this commit
        required: true
        type: string
      source_run:
        description: Successful Source Release run ID for this commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  release-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFICATION_RUN: ${{ inputs.verification_run }}
      NATIVE_RUN: ${{ inputs.native_run }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Assemble the evidence for this source revision
        run: bash scripts/collect-release-evidence.sh "$RUNNER_TEMP/itervane-release-evidence"
      - name: Retain the verified release acceptance receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-acceptance
          path: ${{ runner.temp }}/itervane-release-evidence/release-acceptance.json
          if-no-files-found: error
          retention-days: 14
