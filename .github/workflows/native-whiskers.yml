name: Native Whiskers

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - '.github/workflows/native-whiskers.yml'
      - 'fixtures/whiskers/**'
      - 'fixtures/komodo/Dockerfile'
      - 'packages/portal/test/native/whiskers*.ts'
      - 'packages/control-plane/src/runtime/whiskers-*.ts'
      - 'packages/contracts/src/operations.ts'
      - 'packages/contracts/src/primitives.ts'
      - 'packages/verification/src/native/whiskers.ts'
      - 'packages/verification/src/report.ts'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-whiskers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-whiskers:
    # The host's disposable Docker daemon contains only trusted CI fixtures.
    # Credentials are created locally by the test, and production secrets are excluded.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.9.0 --ignore-scripts
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify bound observations and an approved native restart
        run: pnpm probe:whiskers
      - name: Require native confirmation and observation evidence
        run: |
          jq -e '.status == "passed" and
            ([.checks[] | select(.status == "passed") | .id] |
              contains(["operator-policy", "scoped-writer", "pending", "approved", "binding", "applied", "consumed", "audit",
                "bound-observe-running", "bound-observe-stopped", "bound-observe-unknown", "bound-observe-timeout",
                "bound-log-signals", "bound-metrics-present", "bound-metrics-unavailable", "clean"]))' \
              .reports/p0/whiskers-native.json >/dev/null
      - name: Retain sanitized Whiskers evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: whiskers-native-evidence
          path: .reports/p0/whiskers-native.json
          if-no-files-found: ignore
          retention-days: 14
